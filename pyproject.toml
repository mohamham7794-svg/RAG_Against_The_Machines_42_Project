[project]
name = "rag-against-the-machine"
version = "2.0.0"
description = "A Retrieval-Augmented Generation system over the vLLM codebase"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.6",
    "fire>=0.6.0",
    "tqdm>=4.66",
    "rank-bm25>=0.2.2",
    "transformers>=4.44",
    "torch>=2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "mypy>=1.10",
    "flake8>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
ignore_missing_imports = true
exclude = "(^|/)(\\.venv|venv|build|dist|data)(/|$)"